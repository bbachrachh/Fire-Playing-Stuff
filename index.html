<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Now Playing</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
    }

    body {
        background: #f4f4f0;
        color: #111;
        font-family: Georgia, "Times New Roman", serif;

        display: flex;
        justify-content: center;
        align-items: center;

        overflow: hidden;
    }

    #app {
        width: 100%;
        max-width: 850px;
        height: 100%;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        padding: 5vh 7vw;
    }

    /* =========================
       ALBUM ART
       ========================= */

    #art-wrap {
        position: relative;

        width: min(72vw, 500px);
        height: min(72vw, 500px);

        margin-bottom: 4vh;

        overflow: hidden;
        background: #111;
    }

    #art {
        width: 100%;
        height: 100%;

        object-fit: cover;

        display: block;

        filter: grayscale(100%);
    }

    /*
       Pixel transition overlay.

       16 x 16 = 256 little squares.
       The squares are randomly revealed when
       a new song starts.
    */

    #pixel-transition {
        position: absolute;
        inset: 0;

        display: grid;
        grid-template-columns: repeat(16, 1fr);
        grid-template-rows: repeat(16, 1fr);

        pointer-events: none;

        opacity: 0;

        filter: grayscale(100%);
    }

    .pixel {
        opacity: 0;

        background-repeat: no-repeat;

        transition-property: opacity;
        transition-timing-function: steps(4, end);

        will-change: opacity;
    }


    /* =========================
       TEXT
       ========================= */

    #label {
        font-family: Arial, Helvetica, sans-serif;

        font-size: 11px;
        letter-spacing: 3px;
        font-weight: bold;

        margin-bottom: 1.4vh;

        text-align: center;
    }

    #title {
        font-size: clamp(24px, 4vw, 38px);

        line-height: 1.1;

        text-align: center;

        margin: 0;

        max-width: 90vw;
    }

    #artist {
        font-size: clamp(17px, 2.5vw, 23px);

        margin-top: 9px;

        text-align: center;

        font-style: italic;
    }

    #album {
        font-family: Arial, Helvetica, sans-serif;

        font-size: 11px;

        letter-spacing: 1px;

        margin-top: 8px;

        opacity: 0.65;

        text-align: center;
    }


    /* =========================
       PROGRESS BAR
       ========================= */

    #progress-container {
        width: min(72vw, 500px);

        height: 2px;

        background: #c8c8c4;

        margin-top: 3vh;

        overflow: hidden;
    }

    #progress {
        width: 0%;

        height: 100%;

        background: #111;

        transition: width 0.5s linear;
    }


    /* =========================
       STATUS
       ========================= */

    #status {
        font-family: Arial, Helvetica, sans-serif;

        font-size: 9px;

        letter-spacing: 2px;

        margin-top: 1.5vh;

        opacity: 0.5;

        text-align: center;
    }


    /* =========================
       LOGIN
       ========================= */

    #login {
        border: 1px solid #111;

        background: transparent;

        color: #111;

        padding: 12px 20px;

        font-family: Arial, Helvetica, sans-serif;

        font-size: 12px;

        letter-spacing: 2px;

        cursor: pointer;
    }

    #login:hover {
        background: #111;
        color: #f4f4f0;
    }


    /* =========================
       HIDDEN
       ========================= */

    .hidden {
        display: none !important;
    }


    /* =========================
       SMALL SCREEN
       ========================= */

    @media (max-width: 500px) {

        #app {
            padding: 4vh 5vw;
        }

        #art-wrap {
            width: 78vw;
            height: 78vw;
        }

        #progress-container {
            width: 78vw;
        }

        #title {
            font-size: 25px;
        }

        #artist {
            font-size: 17px;
        }
    }
</style>
</head>


<body>

<div id="app">

    <!-- ALBUM ART -->
    <div id="art-wrap">

        <img
            id="art"
            src=""
            alt="Album artwork"
        >

        <div id="pixel-transition"></div>

    </div>


    <!-- SONG INFO -->

    <div id="label">
        NOW PLAYING
    </div>

    <h1 id="title">
        Nothing Playing
    </h1>

    <div id="artist"></div>

    <div id="album"></div>


    <!-- PROGRESS -->

    <div id="progress-container">
        <div id="progress"></div>
    </div>


    <!-- STATUS -->

    <div id="status">
        WAITING
    </div>


    <!-- LOGIN -->

    <button id="login" class="hidden">
        CONNECT TO SPOTIFY
    </button>

</div>


<script>

/* =========================================================
   SPOTIFY SETTINGS
   ========================================================= */

const CLIENT_ID = "008a9939e20e4eb8b1da4eae05f91fce";

const REDIRECT_URI = " https://bbachrachh.github.io/Fire-Playing-Stuff/";

const SCOPES =
    "user-read-currently-playing user-read-playback-state";


/* =========================================================
   ELEMENTS
   ========================================================= */

const art = document.getElementById("art");

const artWrap = document.getElementById("art-wrap");

const pixelTransition =
    document.getElementById("pixel-transition");

const title =
    document.getElementById("title");

const artist =
    document.getElementById("artist");

const album =
    document.getElementById("album");

const progress =
    document.getElementById("progress");

const status =
    document.getElementById("status");

const loginButton =
    document.getElementById("login");


/* =========================================================
   STATE
   ========================================================= */

let accessToken = null;

let currentTrackId = null;

let currentTrack = null;

let lastProgress = 0;

let lastProgressTime = 0;


/* =========================================================
   PKCE HELPERS
   ========================================================= */

function generateRandomString(length) {

    const chars =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

    let result = "";

    const randomValues =
        crypto.getRandomValues(
            new Uint8Array(length)
        );

    for (let i = 0; i < length; i++) {

        result +=
            chars[randomValues[i] % chars.length];

    }

    return result;
}


async function sha256(plain) {

    const encoder =
        new TextEncoder();

    const data =
        encoder.encode(plain);

    return await crypto.subtle.digest(
        "SHA-256",
        data
    );
}


function base64url(buffer) {

    return btoa(
        String.fromCharCode(...new Uint8Array(buffer))
    )
    .replace(/\+/g, "-")
    .replace(/\//g, "_")
    .replace(/=+$/, "");
}


/* =========================================================
   LOGIN
   ========================================================= */

async function login() {

    const verifier =
        generateRandomString(64);

    const challenge =
        base64url(
            await sha256(verifier)
        );

    localStorage.setItem(
        "spotify_verifier",
        verifier
    );

    const params = new URLSearchParams({

        client_id: CLIENT_ID,

        response_type: "code",

        redirect_uri: REDIRECT_URI,

        scope: SCOPES,

        code_challenge_method: "S256",

        code_challenge: challenge

    });

    window.location.href =
        "https://accounts.spotify.com/authorize?" +
        params.toString();
}


loginButton.addEventListener(
    "click",
    login
);


/* =========================================================
   GET ACCESS TOKEN
   ========================================================= */

async function exchangeCode(code) {

    const verifier =
        localStorage.getItem(
            "spotify_verifier"
        );

    const body =
        new URLSearchParams({

            client_id: CLIENT_ID,

            grant_type:
                "authorization_code",

            code: code,

            redirect_uri:
                REDIRECT_URI,

            code_verifier:
                verifier

        });

    const response =
        await fetch(
            "https://accounts.spotify.com/api/token",
            {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/x-www-form-urlencoded"
                },

                body: body

            }
        );

    if (!response.ok) {

        console.error(
            await response.text()
        );

        throw new Error(
            "Spotify token exchange failed."
        );
    }

    const data =
        await response.json();

    accessToken =
        data.access_token;

    localStorage.setItem(
        "spotify_access_token",
        accessToken
    );
}


/* =========================================================
   CHECK FOR LOGIN CALLBACK
   ========================================================= */

async function checkCallback() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    const code =
        params.get("code");

    if (code) {

        try {

            await exchangeCode(code);

            window.history.replaceState(
                {},
                document.title,
                window.location.pathname
            );

        } catch (error) {

            console.error(error);

            status.textContent =
                "LOGIN ERROR";

            return false;
        }
    }

    accessToken =
        accessToken ||
        localStorage.getItem(
            "spotify_access_token"
        );

    return !!accessToken;
}


/* =========================================================
   PIXEL TRANSITION
   ========================================================= */

function createPixelGrid(imageURL) {

    pixelTransition.innerHTML = "";

    const columns = 16;
    const rows = 16;

    const pixels = [];

    for (let y = 0; y < rows; y++) {

        for (let x = 0; x < columns; x++) {

            const pixel =
                document.createElement("div");

            pixel.className =
                "pixel";


            /*
               The whole album image is used as the
               background, but each square only shows
               its own tiny section.
            */

            pixel.style.backgroundImage =
                `url("${imageURL}")`;

            pixel.style.backgroundSize =
                `${columns * 100}% ${rows * 100}%`;


            const posX =
                columns === 1
                    ? 0
                    : (x / (columns - 1)) * 100;

            const posY =
                rows === 1
                    ? 0
                    : (y / (rows - 1)) * 100;

            pixel.style.backgroundPosition =
                `${posX}% ${posY}%`;


            pixelTransition.appendChild(
                pixel
            );

            pixels.push(pixel);
        }
    }

    return pixels;
}


function shuffle(array) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];
    }

    return array;
}


async function pixelFadeTo(imageURL) {

    /*
       Preload the new album art first.
       This prevents the transition from starting
       before Spotify's image has loaded.
    */

    await new Promise((resolve) => {

        const preload =
            new Image();

        preload.onload =
            resolve;

        preload.onerror =
            resolve;

        preload.src =
            imageURL;

    });


    const pixels =
        createPixelGrid(imageURL);


    /*
       Put the pixel layer over the old artwork.
    */

    pixelTransition.style.opacity = "1";


    /*
       Randomize the order so the image appears
       to dissolve/reconstruct rather than simply
       sweeping across the screen.
    */

    const order =
        shuffle(
            pixels.map(
                (_, index) => index
            )
        );


    const duration = 420;

    const totalTime = 1050;


    /*
       Initially hide every pixel.
    */

    pixels.forEach(pixel => {

        pixel.style.opacity = "0";

        pixel.style.transitionDuration =
            `${duration}ms`;

    });


    /*
       Reveal pixels in randomized groups.
    */

    order.forEach((pixelIndex, i) => {

        const pixel =
            pixels[pixelIndex];


        /*
           Small random variation makes the
           transition feel less mechanical.
        */

        const delay =
            (i / order.length) *
            650 +
            Math.random() * 180;


        setTimeout(() => {

            pixel.style.opacity = "1";

        }, delay);

    });


    /*
       Wait for the transition to finish,
       then make the actual <img> the new image
       and remove the overlay.
    */

    await new Promise(resolve => {

        setTimeout(
            resolve,
            totalTime
        );

    });


    art.src =
        imageURL;


    pixelTransition.style.opacity =
        "0";


    /*
       Give the browser a moment to remove
       the overlay before destroying it.
    */

    setTimeout(() => {

        pixelTransition.innerHTML =
            "";

    }, 100);
}


/* =========================================================
   UPDATE SONG INFORMATION
   ========================================================= */

async function updateSong(track) {

    if (!track) {

        title.textContent =
            "Nothing Playing";

        artist.textContent =
            "";

        album.textContent =
            "";

        status.textContent =
            "NOT PLAYING";

        progress.style.width =
            "0%";

        return;
    }


    const trackId =
        track.item.id;

    const imageURL =
        track.item.album.images.length
            ? track.item.album.images[0].url
            : "";


    /*
       First song after opening the page:
       just show it normally.
    */

    if (currentTrackId === null) {

        currentTrackId =
            trackId;

        currentTrack =
            track;

        art.src =
            imageURL;

    }


    /*
       Actual song change:
       perform the pixel transition.
    */

    else if (
        currentTrackId !== trackId
    ) {

        currentTrackId =
            trackId;

        currentTrack =
            track;


        /*
           Update text immediately while
           the album artwork transitions.
        */

        title.textContent =
            track.item.name;

        artist.textContent =
            track.item.artists
                .map(a => a.name)
                .join(", ");

        album.textContent =
            track.item.album.name;


        status.textContent =
            track.is_playing
                ? "PLAYING"
                : "PAUSED";


        if (imageURL) {

            await pixelFadeTo(
                imageURL
            );

        }

    }


    /*
       Normal display update.
    */

    title.textContent =
        track.item.name;

    artist.textContent =
        track.item.artists
            .map(a => a.name)
            .join(", ");

    album.textContent =
        track.item.album.name;


    status.textContent =
        track.is_playing
            ? "PLAYING"
            : "PAUSED";


    /*
       Progress bar.
    */

    const duration =
        track.item.duration_ms;

    const position =
        track.progress_ms || 0;

    const percentage =
        duration
            ? (position / duration) * 100
            : 0;

    progress.style.width =
        `${percentage}%`;


    lastProgress =
        position;

    lastProgressTime =
        Date.now();
}


/* =========================================================
   GET CURRENTLY PLAYING
   ========================================================= */

async function getCurrentlyPlaying() {

    if (!accessToken) {
        return;
    }

    try {

        const response =
            await fetch(
                "https://api.spotify.com/v1/me/player/currently-playing",
                {

                    headers: {
                        Authorization:
                            `Bearer ${accessToken}`
                    }

                }
            );


        /*
           Spotify returns 204 when nothing
           is currently playing.
        */

        if (response.status === 204) {

            title.textContent =
                "Nothing Playing";

            artist.textContent =
                "";

            album.textContent =
                "";

            status.textContent =
                "NOT PLAYING";

            progress.style.width =
                "0%";

            return;
        }


        /*
           Token expired.
        */

        if (response.status === 401) {

            localStorage.removeItem(
                "spotify_access_token"
            );

            accessToken =
                null;

            loginButton.classList.remove(
                "hidden"
            );

            status.textContent =
                "LOGIN REQUIRED";

            return;
        }


        if (!response.ok) {

            console.error(
                "Spotify error:",
                response.status
            );

            return;
        }


        const track =
            await response.json();


        await updateSong(track);


    } catch (error) {

        console.error(
            "Spotify request failed:",
            error
        );

        status.textContent =
            "CONNECTION ERROR";
    }
}


/* =========================================================
   PROGRESS BAR SMOOTHING
   ========================================================= */

setInterval(() => {

    if (
        !currentTrack ||
        !currentTrack.item
    ) {
        return;
    }

    if (
        !currentTrack.is_playing
    ) {
        return;
    }

    const duration =
        currentTrack.item.duration_ms;

    if (!duration) {
        return;
    }


    /*
       Estimate where the song should be
       between Spotify's 5-second API checks.
    */

    const elapsed =
        Date.now() -
        lastProgressTime;

    const estimated =
        lastProgress +
        elapsed;


    const percentage =
        Math.min(
            100,
            (estimated / duration) * 100
        );


    progress.style.width =
        `${percentage}%`;

}, 500);


/* =========================================================
   INITIALIZE
   ========================================================= */

async function init() {

    const loggedIn =
        await checkCallback();


    if (!loggedIn) {

        loginButton.classList.remove(
            "hidden"
        );

        status.textContent =
            "NOT CONNECTED";

        return;
    }


    loginButton.classList.add(
        "hidden"
    );


    status.textContent =
        "CONNECTING";


    await getCurrentlyPlaying();


    /*
       Spotify gets checked every 5 seconds.
    */

    setInterval(
        getCurrentlyPlaying,
        5000
    );
}


init();

</script>

</body>
</html>
